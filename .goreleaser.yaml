version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: dotai
    main: ./cmd/dotai
    binary: dotai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: memcli
    main: ./cmd/memcli
    binary: memcli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: dotai
    builds:
      - dotai
    name_template: >-
      dotai_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
  - id: memcli
    builds:
      - memcli
    name_template: >-
      memcli_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: dotai
    ids:
      - dotai
    repository:
      owner: TomyQB
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/TomyQB/dotai
    description: "AI coding environment setup wizard, one shot"
    license: MIT
    install: |
      bin.install "dotai"
    test: |
      system "#{bin}/dotai", "version"
  - name: memcli
    ids:
      - memcli
    repository:
      owner: TomyQB
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/TomyQB/dotai
    description: "Read-only browser for .agent-memory/ project trees"
    license: MIT
    install: |
      bin.install "memcli"
    test: |
      system "#{bin}/memcli", "version"
