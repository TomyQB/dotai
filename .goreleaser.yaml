version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/memcli
    binary: memcli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: TomyQB
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/TomyQB/mem-cli
    description: "Living agent-facing documentation for your projects, enforced by hooks"
    license: MIT
    install: |
      bin.install "memcli"
    test: |
      system "#{bin}/memcli", "version"
